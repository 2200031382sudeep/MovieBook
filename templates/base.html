<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MovieBook{% endblock %} - MovieBook</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/">MovieBook</a>
    <div class="links">
      <a href="/">Movies</a>
      {% if current_user %}
        <a href="/theaters">Find theaters</a>
        <a href="/my-bookings">My bookings</a>
        {% if current_user.is_admin %}<a href="/admin">Admin</a>{% endif %}
        <span class="who">Hi, {{ current_user.name }}</span>
        <button id="logout-btn" type="button">Logout</button>
      {% else %}
        <a href="/login">Login</a>
        <a href="/register">Register</a>
      {% endif %}
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
