{% extends "base.html" %}
{% block title %}Cinemas & Theaters Near You - BookMyShow{% endblock %}

{% block content %}
<div class="bms-container" style="margin: 36px auto 60px;">
  <div class="section-header">
    <h1 class="section-title">Theaters & Cinemas</h1>
    <span style="color:var(--bms-text-muted);font-size:14px;">Find cinema halls and movie screens in your city</span>
  </div>

  <!-- Search Toolbar -->
  <form class="bms-theater-card" id="search-form" autocomplete="off" style="margin-bottom:20px;padding:16px 20px;">
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
      <div style="flex:2 1 260px;position:relative;">
        <input id="location" type="search" list="city-list" placeholder="Search by city or area (e.g. Hyderabad, Banjara Hills)..." style="width:100%;padding:10px 14px;border:1px solid var(--bms-border);border-radius:var(--bms-radius);outline:none;">
        <datalist id="city-list"></datalist>
      </div>
      <div style="flex:1 1 200px;">
        <input id="q" type="search" placeholder="Theater name (optional)..." style="width:100%;padding:10px 14px;border:1px solid var(--bms-border);border-radius:var(--bms-radius);outline:none;">
      </div>
      <button class="bms-signin-btn" type="submit" style="padding:10px 24px;">Search</button>
      <button class="bms-signin-btn" type="button" id="clear" style="background:#4b5563;padding:10px 18px;">Clear</button>
    </div>
  </form>

  <!-- City Chips Bar -->
  <div id="chips" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;"></div>

  <!-- Search Status & Results -->
  <div id="status" style="margin-bottom:16px;font-size:13.5px;color:var(--bms-text-muted);"></div>
  <div id="results"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const qInput = document.getElementById("q");
  const locInput = document.getElementById("location");
  const statusBox = document.getElementById("status");
  const resultsBox = document.getElementById("results");
  const cityList = document.getElementById("city-list");
  let timer = null;

  locInput.value = getCity();

  async function loadCities() {
    try {
      const data = await api("/api/cities");
      const chips = document.getElementById("chips");
      chips.innerHTML = "";
      cityList.innerHTML = "";
      data.cities.forEach(city => {
        cityList.appendChild(new Option(city, city));
        const chip = h("button", "filter-chip", city);
        chip.type = "button";
        chip.addEventListener("click", () => {
          locInput.value = city;
          setCity(city);
          searchTheaters();
        });
        chips.appendChild(chip);
      });
    } catch (e) { /* suggestions optional */ }
  }

  function renderTheaters(theaters) {
    resultsBox.innerHTML = "";
    const byCity = new Map();
    theaters.forEach(t => {
      if (!byCity.has(t.city)) byCity.set(t.city, []);
      byCity.get(t.city).push(t);
    });

    if (!theaters.length) {
      resultsBox.innerHTML = `
        <div style="background:#fff;border:1px solid var(--bms-border);border-radius:var(--bms-radius-lg);padding:50px 20px;text-align:center;">
          <div style="font-size:42px;margin-bottom:10px;">🎭</div>
          <h3 style="font-size:17px;font-weight:700;color:var(--bms-text-heading);margin-bottom:6px;">No cinemas found</h3>
          <p style="color:var(--bms-text-muted);font-size:13.5px;">Try searching for another area or select a different city.</p>
        </div>
      `;
      return;
    }

    byCity.forEach((list, city) => {
      const section = h("section");
      section.style.marginBottom = "32px";
      section.appendChild(h("h2", "section-title", city + " (" + list.length + " Cinemas)"));

      list.forEach(t => {
        const card = h("div", "bms-theater-card");
        const top = h("div", "theater-card-top");

        const nameBox = h("div", "theater-name-box");
        const fav = h("span", "theater-fav-icon", "♡");
        fav.addEventListener("click", () => {
          fav.classList.toggle("active");
          fav.textContent = fav.classList.contains("active") ? "♥" : "♡";
        });
        nameBox.appendChild(fav);

        const titleBox = h("div");
        titleBox.appendChild(h("div", "theater-card-title", t.name));
        titleBox.appendChild(h("div", "theater-card-loc", t.location + " • " + t.capacity + " seats • 4K Dolby Atmos"));
        nameBox.appendChild(titleBox);
        top.appendChild(nameBox);

        const amenities = h("div", "theater-amenities");
        amenities.innerHTML = "<span>📱 M-Ticket</span> • <span>🍿 F&B Available</span>";
        top.appendChild(amenities);
        card.appendChild(top);

        const moviesBox = h("div");
        moviesBox.style.marginTop = "14px";
        moviesBox.style.paddingTop = "12px";
        moviesBox.style.borderTop = "1px solid #f2f2f2";

        if (t.movies && t.movies.length) {
          moviesBox.appendChild(h("div", "", "Now Showing:"));
          const row = h("div");
          row.style.display = "flex";
          row.style.gap = "8px";
          row.style.flexWrap = "wrap";
          row.style.marginTop = "8px";

          t.movies.forEach(m => {
            const pill = h("a", "bms-signin-btn", "🎟️ " + m.title);
            pill.href = "/movie/" + m.id;
            pill.style.padding = "6px 14px";
            pill.style.fontSize = "12.5px";
            row.appendChild(pill);
          });
          moviesBox.appendChild(row);
        } else {
          moviesBox.appendChild(h("div", "muted", "No upcoming shows scheduled for today at this cinema."));
        }

        card.appendChild(moviesBox);
        section.appendChild(card);
      });
      resultsBox.appendChild(section);
    });
  }

  async function searchTheaters() {
    const params = new URLSearchParams({ q: qInput.value.trim(), location: locInput.value.trim() });
    statusBox.textContent = "Searching theaters...";
    try {
      const data = await api("/api/theaters?" + params);
      renderTheaters(data.theaters);
      statusBox.textContent = data.theaters.length
        ? "Showing " + data.theaters.length + " theater(s)."
        : "";
    } catch (e) {
      statusBox.textContent = e.message;
    }
  }

  document.getElementById("search-form").addEventListener("submit", e => { e.preventDefault(); searchTheaters(); });
  [qInput, locInput].forEach(el => el.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(searchTheaters, 300);
  }));
  document.getElementById("clear").addEventListener("click", () => {
    qInput.value = "";
    locInput.value = "";
    searchTheaters();
  });

  loadCities();
  searchTheaters();
</script>
{% endblock %}
