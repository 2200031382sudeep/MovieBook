{% extends "base.html" %}
{% block title %}Find theaters{% endblock %}
{% block content %}
<h1>Find theaters</h1>

<form class="toolbar" id="search-form" autocomplete="off">
  <input id="location" type="search" list="city-list" placeholder="Search theater location (city or area)..." style="flex:2 1 300px">
  <datalist id="city-list"></datalist>
  <input id="q" type="search" placeholder="Theater name (optional)">
  <button class="btn" type="submit">Search</button>
  <button class="btn secondary" type="button" id="clear">Clear</button>
</form>

<div id="chips" style="margin-bottom:12px"></div>
<div id="status"></div>
<div id="results"></div>
{% endblock %}

{% block scripts %}
<script>
  const qInput = document.getElementById("q");
  const locInput = document.getElementById("location");
  const statusBox = document.getElementById("status");
  const resultsBox = document.getElementById("results");
  const cityList = document.getElementById("city-list");
  let timer = null;

  locInput.value = getCity();   // the location chosen earlier

  // Suggestions in the box + quick-pick chips, one per city.
  async function loadCities() {
    try {
      const data = await api("/api/theater-cities");
      const chips = document.getElementById("chips");
      data.cities.forEach(city => {
        cityList.appendChild(new Option(city, city));
        const chip = h("button", "pill", city);
        chip.type = "button";
        chip.style.cursor = "pointer";
        chip.style.border = "0";
        chip.addEventListener("click", () => { locInput.value = city; search(); });
        chips.appendChild(chip);
      });
    } catch (e) { /* suggestions are optional */ }
  }

  // Theaters are separated into one section per city.
  function render(theaters) {
    resultsBox.innerHTML = "";
    const byCity = new Map();
    theaters.forEach(t => {
      if (!byCity.has(t.city)) byCity.set(t.city, []);
      byCity.get(t.city).push(t);
    });

    byCity.forEach((list, city) => {
      const section = h("section");
      section.appendChild(h("h2", "", city + " (" + list.length + ")"));

      list.forEach(t => {
        const card = h("div", "card");
        card.appendChild(h("h3", "", t.name));
        card.appendChild(h("div", "place", t.location + "  •  " + t.capacity + " seats"));

        if (t.movies.length) {
          t.movies.forEach(m => {
            const a = h("a", "pill", m.title);
            a.href = "/movie/" + m.id;
            card.appendChild(a);
          });
        } else {
          card.appendChild(h("div", "muted", "No upcoming shows."));
        }
        section.appendChild(card);
      });
      resultsBox.appendChild(section);
    });
  }

  async function search() {
    const params = new URLSearchParams({ q: qInput.value.trim(), location: locInput.value.trim() });
    setCity(locInput.value.trim());
    statusBox.textContent = "Searching...";
    try {
      const data = await api("/api/theater-search?" + params);
      render(data.theaters);
      statusBox.textContent = data.theaters.length
        ? data.theaters.length + " theater(s) found."
        : "No theaters found. Try another name or location.";
    } catch (e) {
      if (e.status === 401) { window.location.href = "/login?next=/theaters"; return; }
      statusBox.textContent = e.message;
    }
  }

  document.getElementById("search-form").addEventListener("submit", e => { e.preventDefault(); search(); });
  [qInput, locInput].forEach(el => el.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(search, 300); }));
  document.getElementById("clear").addEventListener("click", () => { qInput.value = ""; locInput.value = ""; search(); });

  loadCities();
  search();
</script>
{% endblock %}
