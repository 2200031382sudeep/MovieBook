{% extends "base.html" %}
{% block title %}Movies{% endblock %}
{% block content %}
<h1>Now showing</h1>

<div class="toolbar">
  <select id="city" aria-label="Location"></select>
  <input id="q" type="search" placeholder="Search movies...">
</div>

<div id="status"></div>
<div class="grid" id="grid"></div>
{% endblock %}

{% block scripts %}
<script>
  const citySel = document.getElementById("city");
  const qInput = document.getElementById("q");
  const grid = document.getElementById("grid");
  const statusBox = document.getElementById("status");
  let timer = null;

  function movieCard(m) {
    const a = h("a", "movie-card");
    a.href = "/movie/" + m.id;
    a.appendChild(posterElement(m));
    const info = h("div", "info");
    info.appendChild(h("div", "title", m.title));
    info.appendChild(h("div", "muted", [m.language, m.genre].filter(Boolean).join(" • ")));
    info.appendChild(h("div", "muted", "★ " + Number(m.rating).toFixed(1) + "  •  " + m.duration_min + " min"));
    a.appendChild(info);
    return a;
  }

  async function load() {
    const params = new URLSearchParams();
    if (citySel.value) params.set("city", citySel.value);
    if (qInput.value.trim()) params.set("q", qInput.value.trim());
    statusBox.textContent = "Loading...";
    try {
      const data = await api("/api/movies?" + params);
      grid.innerHTML = "";
      data.movies.forEach(m => grid.appendChild(movieCard(m)));
      statusBox.textContent = data.movies.length ? "" :
        "No movies found" + (citySel.value ? " in " + citySel.value : "") + ".";
    } catch (e) {
      statusBox.textContent = e.message;
    }
  }

  citySel.addEventListener("change", () => { setCity(citySel.value); load(); });
  qInput.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(load, 300); });

  fillCitySelect(citySel, "All locations").then(load);
</script>
{% endblock %}
