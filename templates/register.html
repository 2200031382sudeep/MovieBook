{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="panel auth-box">
  <h1>Create account</h1>
  <form id="form">
    <div class="field"><label for="name">Name</label><input id="name" type="text" required maxlength="100" autocomplete="name"></div>
    <div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div>
    <div class="field"><label for="password">Password (min 6 characters)</label><input id="password" type="password" required minlength="6" autocomplete="new-password"></div>
    <div id="msg" class="msg error"></div>
    <button class="btn" type="submit">Register</button>
  </form>
  <p class="muted">Already have an account? <a href="/login">Login</a></p>
</div>
{% endblock %}

{% block scripts %}
<script>
  const msg = document.getElementById("msg");
  document.getElementById("form").addEventListener("submit", async e => {
    e.preventDefault();
    msg.classList.remove("show");
    try {
      await api("/api/auth/register", "POST", {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
      });
      window.location.href = safeNext("/theaters");
    } catch (err) {
      msg.textContent = err.message;
      msg.classList.add("show");
    }
  });
</script>
{% endblock %}
