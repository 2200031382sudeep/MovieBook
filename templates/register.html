{% extends "base.html" %}
{% block title %}Register – MovieBook{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Create your account</h1>
  <form id="registerForm">
    <div class="form-group">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" required autocomplete="name">
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email">
    </div>
    <div class="form-group">
      <label for="password">Password (min 6 characters)</label>
      <input type="password" id="password" name="password" minlength="6" required autocomplete="new-password">
    </div>
    <p class="form-error" id="formError"></p>
    <button type="submit" class="btn btn-block">Register</button>
  </form>
  <p class="auth-switch">Already registered? <a href="/login">Login</a></p>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/auth.js') }}"></script>{% endblock %}
