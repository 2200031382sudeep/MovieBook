{% extends "base.html" %}
{% block title %}Error {{ code }} - BookMyShow{% endblock %}

{% block content %}
<div class="bms-container" style="text-align:center;padding:80px 20px;">
  <div style="font-size:72px;font-weight:900;color:var(--bms-red);margin-bottom:8px;">{{ code }}</div>
  <h2 style="font-size:22px;font-weight:700;color:var(--bms-text-heading);margin-bottom:8px;">Oops! Page Not Found</h2>
  <p style="color:var(--bms-text-muted);font-size:14px;margin-bottom:24px;">{{ message }}</p>
  <a class="bms-signin-btn" href="/" style="display:inline-block;padding:11px 28px;">Back to Home</a>
</div>
{% endblock %}
