{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="panel auth-box">
  <h1>Login</h1>
  <form id="form">
    <div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"></div>
    <div id="msg" class="msg error"></div>
    <button class="btn" type="submit">Login</button>
  </form>
  <p class="muted">New here? <a href="/register">Create an account</a></p>
</div>
{% endblock %}

{% block scripts %}
<script>
  const msg = document.getElementById("msg");
  document.getElementById("form").addEventListener("submit", async e => {
    e.preventDefault();
    msg.classList.remove("show");
    try {
      await api("/api/auth/login", "POST", {
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
      });
      window.location.href = safeNext("/theaters");   // after login: the theater search page
    } catch (err) {
      msg.textContent = err.message;
      msg.classList.add("show");
    }
  });
</script>
{% endblock %}
