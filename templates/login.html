{% extends "base.html" %}
{% block title %}Sign In - BookMyShow{% endblock %}

{% block content %}
<div class="bms-container">
  <div class="bms-auth-container">
    <div class="auth-header-strip">
      <h2>Get Started</h2>
      <p>Sign in to your BookMyShow account</p>
    </div>

    <div class="auth-body">
      <form id="form">
        <div class="bms-input-group">
          <label for="email">Email address</label>
          <input id="email" type="email" placeholder="Enter your email" required autocomplete="email">
        </div>

        <div class="bms-input-group">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <div id="msg" class="msg error"></div>

        <button class="bms-primary-btn" type="submit" style="margin-top:8px;">Sign in</button>
      </form>

      <div class="auth-divider">
        <span>OR</span>
      </div>

      <p style="text-align:center;font-size:13.5px;color:var(--bms-text-muted);">
        Don't have an account? <a href="/register" style="color:var(--bms-red);font-weight:700;">Create Account</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const msg = document.getElementById("msg");
  document.getElementById("form").addEventListener("submit", async e => {
    e.preventDefault();
    msg.classList.remove("show");
    try {
      await api("/api/auth/login", "POST", {
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
      });
      window.location.href = safeNext("/");
    } catch (err) {
      msg.textContent = err.message;
      msg.classList.add("show");
    }
  });
</script>
{% endblock %}
